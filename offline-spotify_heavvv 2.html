<style>
  :root{
    --bg:#121212; --bg2:#181818; --bg3:#202020; --text:#fff; --sub:#a7a7a7;
    --accent:#1db954; --accent-text:#000; --border:#2a2a2a;
  }
  body.theme-light{
    --bg:#ffffff; --bg2:#f7f7f7; --bg3:#ececec; --text:#111; --sub:#666; --border:#dcdcdc;
  }
  body.density-compact .track{padding:5px 12px;}
  body.density-compact .sidebar{padding:10px 10px;}
  body.density-compact .main{padding:14px 18px;}
  .settings-panel{
    background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:12px;
    margin:8px 0 12px; font-size:13px;
  }
  .settings-panel .grp{margin-bottom:12px;}
  .settings-panel .grp:last-child{margin-bottom:0;}
  .settings-panel label{display:block; color:var(--sub); margin-bottom:6px; font-size:12px;}
  .swatches{display:flex; gap:8px;}
  .swatch{
    width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  }
  .swatch.active{border-color:var(--text);}
  .seg{display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;}
  .seg button{
    flex:1; background:var(--bg2); border:none; color:var(--sub); padding:6px 0; font-size:12px; cursor:pointer;
  }
  .seg button.active{background:var(--accent); color:var(--accent-text);}
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
  }
  .layout{flex:1; display:flex; min-height:0;}
  .sidebar{
    width:230px; background:var(--bg2); padding:16px 12px; overflow-y:auto; flex-shrink:0;
    border-right:1px solid var(--border);
  }
  .sidebar h2{font-size:13px; text-transform:uppercase; color:var(--sub); letter-spacing:.05em; margin:0 0 10px 4px;}
  .folder-item{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:8px 10px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--sub);
  }
  .folder-item:hover{background:var(--bg3); color:var(--text);}
  .folder-item.active{background:var(--bg3); color:var(--text); font-weight:600;}
  .folder-item .del{opacity:0; font-size:12px; padding:2px 6px;}
  .folder-item:hover .del{opacity:1;}
  .new-folder-btn{
    width:100%; margin-top:8px; padding:8px; background:none; border:1px dashed var(--border);
    color:var(--sub); border-radius:6px; cursor:pointer; font-size:13px;
  }
  .new-folder-btn:hover{color:var(--text); border-color:var(--sub);}
  .main{flex:1; overflow-y:auto; padding:24px 28px; min-width:0;}
  .main h1{font-size:24px; margin:0 0 4px;}
  .main .count{color:var(--sub); font-size:13px; margin-bottom:20px;}
  .dropzone{
    border:2px dashed var(--border); border-radius:10px; padding:28px; text-align:center;
    color:var(--sub); margin-bottom:24px; cursor:pointer; transition:.15s;
  }
  .dropzone.drag{border-color:var(--accent); color:var(--text); background:#1db95412;}
  .dropzone input{display:none;}
  .track{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:6px; cursor:pointer;
  }
  .track:hover{background:var(--bg3);}
  .track.playing{background:#1db95422;}
  .track .idx{width:20px; color:var(--sub); font-size:13px; text-align:center; flex-shrink:0;}
  .track .play-ic{width:20px; text-align:center; flex-shrink:0; color:var(--accent); display:none;}
  .track.playing .play-ic{display:block;} .track.playing .idx{display:none;}
  .track .name{flex:1; font-size:14px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .track input.rename-input{
    flex:1; background:var(--bg3); border:1px solid var(--accent); color:var(--text);
    font-size:14px; padding:3px 6px; border-radius:4px;
  }
  .track .actions{display:flex; gap:4px; opacity:0; flex-shrink:0;}
  .track:hover .actions{opacity:1;}
  .icon-btn{
    background:none; border:none; color:var(--sub); cursor:pointer; font-size:13px; padding:4px 7px;
    border-radius:4px;
  }
  .icon-btn:hover{color:var(--text); background:var(--bg);}
  .empty-msg{color:var(--sub); font-size:14px; padding:20px 0;}
  select.folder-select{
    background:var(--bg3); color:var(--text); border:1px solid var(--border); border-radius:4px;
    font-size:12px; padding:3px 4px;
  }
  .player{
    height:84px; background:var(--bg2); border-top:1px solid var(--border);
    display:flex; align-items:center; padding:0 18px; gap:16px; flex-shrink:0;
  }
  .now{width:220px; min-width:0;}
  .now .t{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .now .f{font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .controls{display:flex; flex-direction:column; align-items:center; flex:1; gap:4px;}
  .buttons{display:flex; align-items:center; gap:18px;}
  .buttons button{
    background:none; border:none; color:var(--text); cursor:pointer; font-size:18px; padding:4px;
  }
  .buttons .play-btn{
    width:34px; height:34px; border-radius:50%; background:var(--text); color:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  #repeatBtn{font-size:15px; opacity:.6;}
  #repeatBtn.active{opacity:1; color:var(--accent);}
  #shuffleBtn{font-size:15px; opacity:.6;}
  #shuffleBtn.active{opacity:1; color:var(--accent);}
  #lyricsBtn{font-size:15px; opacity:.6;}
  #lyricsBtn.active{opacity:1; color:var(--accent);}
  #lyricsPanel{
    position:fixed; right:18px; bottom:100px; width:340px; max-height:60vh;
    background:var(--bg2); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:500; display:flex; flex-direction:column;
  }
  #lyricsPanel .lp-header{
    display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
    border-bottom:1px solid var(--border); font-size:14px; font-weight:600;
  }
  #lyricsPanel .lp-close{background:none; border:none; color:var(--sub); cursor:pointer; font-size:16px;}
  #lyricsPanel .lp-body{padding:14px; overflow-y:auto; font-size:14px; line-height:1.6; white-space:pre-wrap; flex:1;}
  #lyricsPanel .lp-empty{color:var(--sub); font-size:13px;}
  #lyricsPanel textarea{
    width:100%; min-height:160px; background:var(--bg3); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:8px; font-size:13px; font-family:inherit; resize:vertical;
  }
  #lyricsPanel .lp-footer{padding:10px 14px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end;}
  #lyricsPanel .lp-footer button{
    border:none; border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer;
  }
  #lyricsPanel .lp-edit{background:var(--bg3); color:var(--text); border:1px solid var(--border) !important;}
  #lyricsPanel .lp-save{background:var(--accent); color:var(--accent-text);}
  body.mobile-mode #lyricsPanel{
    right:10px; left:10px; width:auto; bottom:90px;
  }
  body.mobile-mode #queuePanel{
    right:10px; left:10px; width:auto; bottom:90px; top:10px;
    max-height:calc(100vh - 170px);
  }
  #queuePanel{
    position:fixed; right:18px; bottom:100px; top:18px; width:340px;
    max-height:calc(100vh - 130px);
    background:var(--bg2); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:500; display:flex; flex-direction:column;
    overflow:hidden;
  }
  #queuePanel .lp-header{
    display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
    border-bottom:1px solid var(--border); font-size:14px; font-weight:600;
    flex-shrink:0;
  }
  #queuePanel .lp-close{background:none; border:none; color:var(--sub); cursor:pointer; font-size:16px;}
  #queuePanel .lp-body{
    padding:6px; overflow-y:auto; flex:1; min-height:0;

<script>
let tracks = []; // {id, name, url, folders: []}
let folders = ["All tracks"];
let currentFolder = "All tracks";
let currentTrackId = null;
let idCounter = 1;
const folderCovers = {}; // folderName -> object URL (custom cover)
const folderCoverRawBlobs = {}; // folderName -> raw Blob (for persistence)
let selectMode = false;
let selectedIds = new Set();

// Listening stats: { plays: { [trackId]: {count, seconds} }, totalSeconds: number }
let statsData = { plays: {}, totalSeconds: 0 };

// IndexedDB persistence
let db = null;
let dirty = false;
let persistTimer = null;

const settings = {
  accent: '#1db954',
  theme: 'dark',
  density: 'cozy'
};
const ACCENTS = ['#1db954', '#378ADD', '#D85A30', '#D4537E', '#7F77DD', '#EF9F27'];

const audio = document.getElementById('audio');
const folderListEl = document.getElementById('folderList');
const trackListEl = document.getElementById('trackList');
const folderTitleEl = document.getElementById('folderTitle');
const trackCountEl = document.getElementById('trackCount');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

// ---- Settings ----
function applySettings(){
  document.documentElement.style.setProperty('--accent', settings.accent);
  document.body.classList.toggle('theme-light', settings.theme === 'light');
  document.body.classList.toggle('density-compact', settings.density === 'compact');
}

document.getElementById('settingsBtn').onclick = ()=>{
  const panel = document.getElementById('settingsPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  renderSettingsPanel();
};

function renderSettingsPanel(){
  const panel = document.getElementById('settingsPanel');
  if(panel.style.display === 'none') return;
  panel.innerHTML = `
    <div class="settings-panel">
      <div class="grp">
        <label>Accent color</label>
        <div class="swatches">
          ${ACCENTS.map(c=>`<div class="swatch${c===settings.accent?' active':''}" style="background:${c}" data-color="${c}"></div>`).join('')}
        </div>
      </div>
      <div class="grp">
        <label>Theme</label>
        <div class="seg">
          <button data-theme="dark" class="${settings.theme==='dark'?'active':''}">Dark</button>
          <button data-theme="light" class="${settings.theme==='light'?'active':''}">Light</button>
        </div>
      </div>
      <div class="grp">
        <label>Layout</label>
        <div class="seg">
          <button data-density="cozy" class="${settings.density==='cozy'?'active':''}">Cozy</button>
          <button data-density="compact" class="${settings.density==='compact'?'active':''}">Compact</button>
        </div>
      </div>
      <div class="grp">
        <label>Screen size</label>
        <div class="seg">
          <button id="modeDesktopBtn" class="${!document.body.classList.contains('mobile-mode')?'active':''}">Laptop/PC</button>
          <button id="modeMobileBtn" class="${document.body.classList.contains('mobile-mode')?'active':''}">Phone/Tablet</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modeDesktopBtn').onclick = ()=>{
    try{ localStorage.setItem('offlinePlayerDeviceMode', 'desktop'); }catch(e){}
    applyDeviceMode('desktop'); renderSettingsPanel();
  };
  document.getElementById('modeMobileBtn').onclick = ()=>{
    try{ localStorage.setItem('offlinePlayerDeviceMode', 'mobile'); }catch(e){}
    applyDeviceMode('mobile'); renderSettingsPanel();
  };
  panel.querySelectorAll('.swatch').forEach(sw=>{
    sw.onclick = ()=>{ settings.accent = sw.dataset.color; applySettings(); renderSettingsPanel(); schedulePersist(); };
  });
  panel.querySelectorAll('[data-theme]').forEach(btn=>{
    btn.onclick = ()=>{ settings.theme = btn.dataset.theme; applySettings(); renderSettingsPanel(); schedulePersist(); };
  });
  panel.querySelectorAll('[data-density]').forEach(btn=>{
    btn.onclick = ()=>{ settings.density = btn.dataset.density; applySettings(); renderSettingsPanel(); schedulePersist(); };
  });
}

applySettings();

// ---- Persistence (IndexedDB — fully offline, no account/login needed) ----
const DB_NAME = 'offlinePlayerDB';
const DB_VERSION = 1;

function openDB(){
  return new Promise((resolve)=>{
    if(!('indexedDB' in window)){ resolve(null); return; }
    try{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains('state')) d.createObjectStore('state', { keyPath: 'key' });
      };
      req.onsuccess = (e)=> resolve(e.target.result);
      req.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
}

function dbPutState(value){
  return new Promise((resolve)=>{
    if(!db){ resolve(); return; }
    try{
      const tx = db.transaction('state', 'readwrite');
      tx.objectStore('state').put(value);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> resolve();
    }catch(e){ resolve(); }
  });
}

function dbGetState(){
  return new Promise((resolve)=>{
    if(!db){ resolve(null); return; }
    try{
      const tx = db.transaction('state', 'readonly');
      const req = tx.objectStore('state').get('main');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
}

function markDirty(){ dirty = true; }

function schedulePersist(){
  markDirty();
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{ persistAll(); }, 800);
}

async function persistAll(){
  if(!dirty || !db) return;
  dirty = false;
  const data = {
    key: 'main',
    idCounter,
    folders,
    settings,
    statsData,
    tracksData: tracks.map(t => ({
      id: t.id, name: t.name, artist: t.artist, lyrics: t.lyrics || null,
      folders: t.folders, audioBlob: t.rawBlob, coverBlob: t.rawCoverBlob || null
    })),
    folderCoverBlobs: { ...folderCoverRawBlobs }
  };
  await dbPutState(data);
}

async function loadState(){
  const data = await dbGetState();
  if(!data) return;
  idCounter = data.idCounter || 1;
  folders = data.folders && data.folders.length ? data.folders : ["All tracks"];
  if(data.settings) Object.assign(settings, data.settings);
  statsData = data.statsData || { plays: {}, totalSeconds: 0 };

  tracks = (data.tracksData || []).map(td=>{
    let url = null, coverUrl = null;
    try{ url = URL.createObjectURL(td.audioBlob); }catch(e){ /* corrupted entry, skip audio */ }
    if(td.coverBlob){
      try{ coverUrl = URL.createObjectURL(td.coverBlob); }catch(e){ /* fine, no cover */ }
    }
    return {
      id: td.id, name: td.name, artist: td.artist || '', lyrics: td.lyrics || null,
      folders: td.folders || [], coverUrl, url,
      rawBlob: td.audioBlob, rawCoverBlob: td.coverBlob || null
    };
  }).filter(t => t.url); // drop any track whose audio failed to load

  Object.entries(data.folderCoverBlobs || {}).forEach(([name, blob])=>{
    folderCoverRawBlobs[name] = blob;
    try{ folderCovers[name] = URL.createObjectURL(blob); }catch(e){ /* fine */ }
  });

  applySettings();
}

// ---- Device mode (mobile vs desktop) ----
function applyDeviceMode(mode){
  document.body.classList.toggle('mobile-mode', mode === 'mobile');
}

function hideDeviceChooser(){
  const el = document.getElementById('deviceChooser');
  if(el) el.style.display = 'none';
}

function showDeviceChooser(){
  const el = document.getElementById('deviceChooser');
  if(el) el.style.display = 'flex';
}

(function initDeviceMode(){
  let saved = null;
  try{ saved = localStorage.getItem('offlinePlayerDeviceMode'); }catch(e){ /* ignore */ }
  if(saved === 'mobile' || saved === 'desktop'){
    applyDeviceMode(saved);
    hideDeviceChooser();
  }
})();

document.getElementById('chooseMobile').addEventListener('click', ()=>{
  try{ localStorage.setItem('offlinePlayerDeviceMode', 'mobile'); }catch(e){ /* ignore */ }
  applyDeviceMode('mobile');
  hideDeviceChooser();
});

document.getElementById('chooseDesktop').addEventListener('click', ()=>{
  try{ localStorage.setItem('offlinePlayerDeviceMode', 'desktop'); }catch(e){ /* ignore */ }
  applyDeviceMode('desktop');
  hideDeviceChooser();
});

// ---- Folder cover art ----
function buildCoverHtml(folderName, sizeClass){
  if(folderCovers[folderName]){
    return `<div class="${sizeClass} single"><img src="${folderCovers[folderName]}"></div>`;
  }
  const list = getListForFolder(folderName === 'All tracks' ? 'All tracks' : folderName);
  const covers = list.map(t=>t.coverUrl).filter(Boolean).slice(0,4);
  if(covers.length === 0){
    return `<div class="${sizeClass}"><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>`;
  }
  if(covers.length === 1){
    return `<div class="${sizeClass} single"><img src="${covers[0]}"></div>`;
  }
  const slots = [0,1,2,3].map(i=> covers[i] ? `<img src="${covers[i]}">` : `<div class="ph"></div>`).join('');
  return `<div class="${sizeClass}">${slots}</div>`;
}

// ---- File handling ----
async function handleFiles(fileList){
  for(const file of fileList){
    if(file.name.toLowerCase().endsWith('.zip') || file.type==='application/zip'){
      await handleZip(file);
    } else if(file.type==='audio/mpeg' || file.name.toLowerCase().endsWith('.mp3')){
      await addTrack(file, file.name.replace(/\.mp3$/i,''));
    }
  }
  render();
}

async function handleZip(zipFile){
  try{
    const zip = await JSZip.loadAsync(zipFile);
    const entries = Object.values(zip.files).filter(f=>!f.dir && f.name.toLowerCase().endsWith('.mp3'));
    for(const entry of entries){
      const blob = await entry.async('blob');
      const mp3blob = new Blob([blob], {type:'audio/mpeg'});
      const name = entry.name.split('/').pop().replace(/\.mp3$/i,'');
      await addTrack(mp3blob, name);
    }
  }catch(err){
    showMessage('Could not read zip file: ' + err.message);
  }
}

function readTagsAsync(fileOrBlob){
  return new Promise((resolve)=>{
    if(typeof jsmediatags === 'undefined'){ resolve({}); return; }
    jsmediatags.read(fileOrBlob, {
      onSuccess: (result)=>{
        const tags = result.tags || {};
        let coverUrl = null;
        let coverBlob = null;
        if(tags.picture){
          try{
            const { data, format } = tags.picture;
            const bytes = new Uint8Array(data);
            coverBlob = new Blob([bytes], { type: format });
            coverUrl = URL.createObjectURL(coverBlob);
          }catch(e){ /* no cover, fine */ }
        }
        // Embedded lyrics (ID3 USLT frame) come through in a couple of shapes
        // depending on the encoder, so check both.
        let lyrics = null;
        if(tags.lyrics){
          if(typeof tags.lyrics === 'string' && tags.lyrics.trim()) lyrics = tags.lyrics.trim();
          else if(tags.lyrics.lyrics && tags.lyrics.lyrics.trim()) lyrics = tags.lyrics.lyrics.trim();
        }
        resolve({
          title: (tags.title && tags.title.trim()) ? tags.title.trim() : null,
          artist: (tags.artist && tags.artist.trim()) ? tags.artist.trim() : null,
          coverUrl,
          coverBlob,
          lyrics
        });
      },
      onError: ()=> resolve({})
    });
  });
}

async function addTrack(fileOrBlob, filenameFallback){
  const tagInfo = await readTagsAsync(fileOrBlob);
  const displayName = tagInfo.title || filenameFallback || 'Untitled';
  const artist = tagInfo.artist || '';
  const norm = (s)=> (s||'').toLowerCase().trim();

  // Match on the real song title + artist (from tags), not the raw file bytes.
  // This way the same song still counts as "the same" whether it arrived
  // as a standalone MP3 or packed inside a zip, even if the file sizes differ.
  const existing = tracks.find(t => norm(t.name) === norm(displayName) && norm(t.artist) === norm(artist));
  if(existing){
    if(currentFolder !== 'All tracks' && !existing.folders.includes(currentFolder)){
      existing.folders.push(currentFolder);
      schedulePersist();
    }
    if(tagInfo.coverUrl) URL.revokeObjectURL(tagInfo.coverUrl);
    return;
  }

  const url = URL.createObjectURL(fileOrBlob);
  const track = {
    id: idCounter++,
    name: displayName,
    artist,
    coverUrl: tagInfo.coverUrl || null,
    lyrics: tagInfo.lyrics || null,
    url,
    folders: currentFolder!=='All tracks' ? [currentFolder] : [],
    rawBlob: fileOrBlob,
    rawCoverBlob: tagInfo.coverBlob || null
  };
  tracks.push(track);
  schedulePersist();
}

// ---- Playback / Queue ----
// The queue is a list of track ids representing what's coming up.
// Starting playback from a folder builds a fresh queue from that folder's
// current order. Once playing, you can reorder/remove items in the Queue
// panel — that only affects this session's playback order, never the
// folder's actual contents. Switching to a different folder replaces the
// queue entirely, as requested.
let queue = [];
let queueIndex = -1;
let queueSourceFolder = null;

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueueFromFolder(folder){
  const list = getListForFolder(folder);
  queue = list.map(t => t.id);
  queueSourceFolder = folder;
}

function removeFromQueue(id){
  const idx = queue.indexOf(id);
  if(idx === -1) return;
  queue.splice(idx, 1);
  if(idx < queueIndex) queueIndex--;
  else if(idx === queueIndex) queueIndex = Math.min(queueIndex, queue.length - 1);
}

document.getElementById('shuffleBtn').onclick = ()=>{
  if(queue.length < 2) return;
  const currentId = queue[queueIndex];
  queue = shuffleArray(queue);
  queueIndex = queue.indexOf(currentId);
  renderQueuePanel();
};

function playTrack(id, folderContext){
  if(folderContext && folderContext !== queueSourceFolder){
    buildQueueFromFolder(folderContext);
  }
  let idx = queue.indexOf(id);
  if(idx === -1){
    queue = [id];
    queueSourceFolder = folderContext || queueSourceFolder;
    idx = 0;
  }
  playTrackByQueueIndex(idx);
}

function playTrackByQueueIndex(idx){
  if(idx < 0 || idx >= queue.length) return;
  const id = queue[idx];
  const t = tracks.find(x=>x.id===id);
  if(!t) return;
  queueIndex = idx;
  const isNewTrack = currentTrackId !== id;
  currentTrackId = id;
  // iOS Safari/WebKit bug: just reassigning .src on an <audio> element that
  // already has a different blob: URL loaded will often silently NOT switch
  // tracks. The UI updates fine (it's just JS state), but the media engine
  // keeps decoding the OLD file, so timeupdate/duration never update again
  // and playback gets permanently stuck after the first song change. This
  // race is normally masked online by network jitter, which is why it only
  // showed up reliably offline. Calling .load() explicitly forces WebKit to
  // actually reset and load the new src every time.
  audio.pause();
  audio.src = t.url;
  audio.load();
  // audio.play() returns a Promise that can be REJECTED by the browser
  // (very common on iOS Safari when switching tracks, auto-advancing
  // after a song ends, or resuming after the tab/app was backgrounded).
  // Previously this was fire-and-forget, so a rejection left the UI
  // (including the iOS lock-screen/Dynamic Island media controls)
  // showing the new track as "playing" while the <audio> element never
  // actually started -- silent, with no way to recover except a full
  // page reload. Now we retry once the page is actually visible/focused
  // again, which is the moment iOS will actually allow playback.
  attemptPlay(id);
  updateNowPlaying(t);
  render();
  if(isNewTrack) recordPlayStart(id);
  if(document.getElementById('lyricsPanel').style.display !== 'none') renderLyricsPanel();
  if(document.getElementById('queuePanel').style.display !== 'none') renderQueuePanel();
}

function attemptPlay(forId){
  const playAttempt = audio.play();
  if(playAttempt && typeof playAttempt.catch === 'function'){
    playAttempt.catch(()=>{
      const resumeOnceReady = ()=>{
        if(document.visibilityState === 'visible' && currentTrackId === forId){
          audio.play().then(()=>{
            document.getElementById('playBtn').innerHTML = '&#10074;&#10074;';
          }).catch(()=>{ /* still blocked, will retry on next visibility/focus event */ });
        }
        document.removeEventListener('visibilitychange', resumeOnceReady);
        window.removeEventListener('focus', resumeOnceReady);
      };
      document.addEventListener('visibilitychange', resumeOnceReady);
      window.addEventListener('focus', resumeOnceReady);
    });
  }
}

function updateNowPlaying(t){
  document.getElementById('nowTitle').textContent = t ? t.name : 'Nothing playing';
  document.getElementById('nowFolder').textContent = t
    ? (t.artist ? t.artist : (t.folders.length ? t.folders.join(', ') : 'No folder'))
    : '\u00A0';
  document.getElementById('playBtn').innerHTML = (t && !audio.paused) ? '&#10074;&#10074;' : '&#9658;';
  const coverWrap = document.getElementById('nowCoverWrap');
  if(t && t.coverUrl){
    coverWrap.outerHTML = `<img id="nowCoverWrap" class="now-cover" src="${t.coverUrl}">`;
  } else {
    coverWrap.outerHTML = `<div id="nowCoverWrap" class="now-cover-placeholder">&#9835;</div>`;
  }
}

document.getElementById('playBtn').onclick = ()=>{
  if(!audio.src) return;
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
};
audio.onplay = ()=>{ document.getElementById('playBtn').innerHTML='&#10074;&#10074;'; };
audio.onpause = ()=>{ document.getElementById('playBtn').innerHTML='&#9658;'; };

document.getElementById('nextBtn').onclick = ()=>skip(1);
document.getElementById('prevBtn').onclick = ()=>skip(-1);

let repeatOne = false;
document.getElementById('repeatBtn').onclick = ()=>{
  repeatOne = !repeatOne;
  document.getElementById('repeatBtn').classList.toggle('active', repeatOne);
};

function skip(dir){
  if(!queue.length) return;
  let newIdx = queueIndex + dir;
  if(newIdx < 0) newIdx = queue.length - 1;
  if(newIdx >= queue.length) newIdx = 0;
  playTrackByQueueIndex(newIdx);
}

audio.onended = ()=>{
  if(repeatOne){
    audio.currentTime = 0;
    attemptPlay(currentTrackId);
    recordPlayStart(currentTrackId);
  } else {
    skip(1);
  }
};

// Re-sync playback whenever the tab/app regains visibility or focus.
// This is the iOS-specific fix: when the app is backgrounded (or the
// phone is locked) and a song ends, audio.onended may not fire at all
// until you return, and even when it does, the resulting play() call
// is reliably rejected by iOS because it's not happening inside a
// direct user gesture. Without this listener, the UI (and even the
// lock-screen/Dynamic Island controls) shows the track as playing with
// no actual sound, and nothing ever recovers until a manual reload.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  if(currentTrackId == null) return;
  const t = tracks.find(x=>x.id===currentTrackId);
  if(!t) return;
  if(!audio.src || audio.src !== t.url){
    const wasPlaying = !audio.paused;
    const savedTime = audio.currentTime;
    audio.src = t.url;
    audio.load();
    const onMeta = ()=>{
      audio.currentTime = savedTime || 0;
      if(wasPlaying) attemptPlay(currentTrackId);
      audio.removeEventListener('loadedmetadata', onMeta);
    };
    audio.addEventListener('loadedmetadata', onMeta);
  } else if(audio.ended){
    if(repeatOne){
      audio.currentTime = 0;
      attemptPlay(currentTrackId);
    } else {
      skip(1);
    }
  } else if(audio.paused && !audio.ended){
    // Track is mid-playback but got paused by the OS while backgrounded
    // (common on iOS) -- resume it now that we're actually foregrounded.
    attemptPlay(currentTrackId);
  }
  render();
  if(document.getElementById('queuePanel').style.display !== 'none') renderQueuePanel();
});

// ---- Queue panel ----

function renderQueuePanel(){
  const panel = document.getElementById('queuePanel');
  const label = queueSourceFolder ? `Queue \u2014 ${queueSourceFolder}` : 'Queue';
  panel.innerHTML = `
    <div class="lp-header"><span>${escapeHtml(label)}</span><button class="lp-close" id="qpCloseBtn">&#10005;</button></div>
    <div class="lp-body" id="qpBody"></div>
  `;
  document.getElementById('qpCloseBtn').onclick = ()=>{ panel.style.display='none'; document.getElementById('queueBtn').classList.remove('active'); };
  const body = document.getElementById('qpBody');
  if(!queue.length){
    body.innerHTML = '<div class="lp-empty">Nothing queued. Play a song from a folder to start one.</div>';
    return;
  }
  body.innerHTML = queue.map((id, i)=>{
    const t = tracks.find(x=>x.id===id);
    if(!t) return '';
    return `
      <div class="q-row${i===queueIndex?' current':''}" data-idx="${i}">
        ${t.coverUrl ? `<img class="q-cover" src="${t.coverUrl}">` : `<div class="q-cover-ph"></div>`}
        <div class="q-meta">
          <div class="q-title">${escapeHtml(t.name)}</div>
          ${t.artist ? `<div class="q-artist">${escapeHtml(t.artist)}</div>` : ''}
        </div>
        <div class="q-actions">
          <button class="q-up" title="Move up">&#9650;</button>
          <button class="q-down" title="Move down">&#9660;</button>
          <button class="q-remove" title="Remove from queue">&#10005;</button>
        </div>
      </div>
    `;
  }).join('');

  body.querySelectorAll('.q-row').forEach(row=>{
    const i = parseInt(row.dataset.idx, 10);
    row.querySelector('.q-meta').onclick = ()=> playTrackByQueueIndex(i);
    row.querySelector('.q-up').onclick = (e)=>{
      e.stopPropagation();
      if(i === 0) return;
      [queue[i-1], queue[i]] = [queue[i], queue[i-1]];
      if(queueIndex === i) queueIndex--; else if(queueIndex === i-1) queueIndex++;
      renderQueuePanel();
    };
    row.querySelector('.q-down').onclick = (e)=>{
      e.stopPropagation();
      if(i === queue.length - 1) return;
      [queue[i], queue[i+1]] = [queue[i+1], queue[i]];
      if(queueIndex === i) queueIndex++; else if(queueIndex === i+1) queueIndex--;
      renderQueuePanel();
    };
    row.querySelector('.q-remove').onclick = (e)=>{
      e.stopPropagation();
      const removedId = queue[i];
      removeFromQueue(removedId);
      if(removedId === currentTrackId){
        if(queue.length){
          playTrackByQueueIndex(Math.min(i, queue.length - 1));
        } else {
          audio.pause(); audio.removeAttribute('src'); currentTrackId = null; updateNowPlaying(null); render();
        }
      }
      renderQueuePanel();
    };
  });
}

// ---- Listening stats ----
function recordPlayStart(id){
  if(id == null) return;
  if(!statsData.plays[id]) statsData.plays[id] = { count: 0, seconds: 0 };
  statsData.plays[id].count++;
  schedulePersist();
}

// Accrue listening time once per second while something is actually playing.
setInterval(()=>{
  if(!audio.paused && currentTrackId != null){
    if(!statsData.plays[currentTrackId]) statsData.plays[currentTrackId] = { count: 0, seconds: 0 };
    statsData.plays[currentTrackId].seconds += 1;
    statsData.totalSeconds = (statsData.totalSeconds || 0) + 1;
    markDirty();
  }
}, 1000);

// Continuous playback keeps the debounce timer perpetually reset, so this
// safety-net flush guarantees stats actually get saved every ~10s regardless.
setInterval(()=>{ if(dirty) persistAll(); }, 10000);

function formatDuration(totalSeconds){
  const s = Math.floor(totalSeconds || 0);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if(h > 0) return `${h}h ${m}m`;
  if(m > 0) return `${m}m`;
  return `${s}s`;
}

// ---- Profile / stats panel ----
document.getElementById('profileBtn').onclick = ()=>{
  const panel = document.getElementById('profilePanel');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  if(!isOpen) renderProfilePanel();
};

function renderProfilePanel(){
  const panel = document.getElementById('profilePanel');
  const entries = Object.entries(statsData.plays || {});
  if(!entries.length){
    panel.innerHTML = '<div class="lp-empty">No listening data yet \u2014 play some songs!</div>';
    return;
  }

  let topSongId = null, topSongSeconds = -1;
  entries.forEach(([id, d])=>{ if(d.seconds > topSongSeconds){ topSongSeconds = d.seconds; topSongId = id; } });
  const topTrack = tracks.find(t => String(t.id) === String(topSongId));

  const artistSeconds = {};
  entries.forEach(([id, d])=>{
    const t = tracks.find(x => String(x.id) === String(id));
    if(t && t.artist){ artistSeconds[t.artist] = (artistSeconds[t.artist] || 0) + d.seconds; }
  });
  let topArtist = null, topArtistSeconds = -1;
  Object.entries(artistSeconds).forEach(([a, s])=>{ if(s > topArtistSeconds){ topArtistSeconds = s; topArtist = a; } });

  panel.innerHTML = `
    <div class="stat-row"><span>Total listening time</span><b>${formatDuration(statsData.totalSeconds)}</b></div>
    <div class="stat-divider"></div>
    <div class="stat-row"><span>Most played song</span><b>${topTrack ? escapeHtml(topTrack.name) : '\u2014'}</b></div>
    <div class="stat-row"><span>Most played artist</span><b>${topArtist ? escapeHtml(topArtist) : '\u2014'}</b></div>
  `;
}


document.getElementById('lyricsBtn').onclick = ()=>{
  const panel = document.getElementById('lyricsPanel');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  document.getElementById('lyricsBtn').classList.toggle('active', !isOpen);
  if(!isOpen) renderLyricsPanel();
};

function renderLyricsPanel(){
  const panel = document.getElementById('lyricsPanel');
  const t = tracks.find(x=>x.id===currentTrackId);
  if(!t){
    panel.innerHTML = `
      <div class="lp-header"><span>Lyrics</span><button class="lp-close" id="lpCloseBtn">&#10005;</button></div>
      <div class="lp-body"><div class="lp-empty">Nothing playing yet.</div></div>
    `;
    document.getElementById('lpCloseBtn').onclick = ()=>{ panel.style.display='none'; document.getElementById('lyricsBtn').classList.remove('active'); };
    return;
  }
  panel.innerHTML = `
    <div class="lp-header"><span>${escapeHtml(t.name)}</span><button class="lp-close" id="lpCloseBtn">&#10005;</button></div>
    <div class="lp-body" id="lpBody"></div>
    <div class="lp-footer">
      <button class="lp-edit" id="lpEditBtn">${t.lyrics ? 'Edit' : 'Add lyrics'}</button>
    </div>
  `;
  const body = document.getElementById('lpBody');
  if(t.lyrics){
    body.textContent = t.lyrics;
  } else {
    body.innerHTML = '<div class="lp-empty">No lyrics found in this file\'s tags. You can paste your own below.</div>';
  }
  document.getElementById('lpCloseBtn').onclick = ()=>{ panel.style.display='none'; document.getElementById('lyricsBtn').classList.remove('active'); };
  document.getElementById('lpEditBtn').onclick = ()=>{
    body.innerHTML = `<textarea id="lpTextarea" placeholder="Paste lyrics here...">${escapeHtml(t.lyrics || '')}</textarea>`;
    const footer = panel.querySelector('.lp-footer');
    footer.innerHTML = `<button class="lp-edit" id="lpCancelBtn">Cancel</button><button class="lp-save" id="lpSaveBtn">Save</button>`;
    document.getElementById('lpCancelBtn').onclick = ()=> renderLyricsPanel();
    document.getElementById('lpSaveBtn').onclick = ()=>{
      t.lyrics = document.getElementById('lpTextarea').value.trim() || null;
      schedulePersist();
      renderLyricsPanel();
    };
  };
}

audio.ontimeupdate = ()=>{
  if(!audio.duration) return;
  document.getElementById('seek').value = (audio.currentTime/audio.duration)*100;
  document.getElementById('curTime').textContent = fmtTime(audio.currentTime);
  document.getElementById('durTime').textContent = fmtTime(audio.duration);
};
document.getElementById('seek').oninput = (e)=>{
  if(!audio.duration) return;
  audio.currentTime = (e.target.value/100)*audio.duration;
};
document.getElementById('vol').oninput = (e)=>{ audio.volume = e.target.value; };
audio.volume = 0.8;

function fmtTime(s){
  if(isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

(async function init(){
  db = await openDB();
  await loadState();
  render();
})();

// ---- PWA: register service worker so this works fully offline after first load ----
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if this fails, e.g. on file:// */ });
  });
}
