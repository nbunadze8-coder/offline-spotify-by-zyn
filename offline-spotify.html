<script>
let tracks = []; // {id, name, url, folders: []}
let folders = ["All tracks"];
let currentFolder = "All tracks";
let currentTrackId = null;
let idCounter = 1;
const folderCovers = {}; // folderName -> object URL (custom cover)
const folderCoverRawBlobs = {}; // folderName -> raw Blob (for persistence)
let selectMode = false;
let selectedIds = new Set();

// Listening stats: { plays: { [trackId]: {count, seconds} }, totalSeconds: number }
let statsData = { plays: {}, totalSeconds: 0 };

// IndexedDB persistence
let db = null;
let dirty = false;
let persistTimer = null;
let storageWarned = false;

const settings = {
  accent: '#1db954',
  theme: 'dark',
  density: 'cozy'
};
const ACCENTS = ['#1db954', '#378ADD', '#D85A30', '#D4537E', '#7F77DD', '#EF9F27'];

const audio = document.getElementById('audio');
const folderListEl = document.getElementById('folderList');
const trackListEl = document.getElementById('trackList');
const folderTitleEl = document.getElementById('folderTitle');
const trackCountEl = document.getElementById('trackCount');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

// ---- Toasts (lightweight, no native alerts — see earlier fix for why) ----
function showToast(message, ms){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, ms || 4000);
}

// ---- Settings ----
function applySettings(){
  document.documentElement.style.setProperty('--accent', settings.accent);
  document.body.classList.toggle('theme-light', settings.theme === 'light');
  document.body.classList.toggle('density-compact', settings.density === 'compact');
}

document.getElementById('settingsBtn').onclick = ()=>{
  const panel = document.getElementById('settingsPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  renderSettingsPanel();
};

function renderSettingsPanel(){
  const panel = document.getElementById('settingsPanel');
  if(panel.style.display === 'none') return;
  panel.innerHTML = `
    <div class="settings-panel">
      <div class="grp">
        <label>Accent color</label>
        <div class="swatches">
          ${ACCENTS.map(c=>`<div class="swatch${c===settings.accent?' active':''}" style="background:${c}" data-color="${c}"></div>`).join('')}
        </div>
      </div>
      <div class="grp">
        <label>Theme</label>
        <div class="seg">
          <button data-theme="dark" class="${settings.theme==='dark'?'active':''}">Dark</button>
          <button data-theme="light" class="${settings.theme==='light'?'active':''}">Light</button>
        </div>
      </div>
      <div class="grp">
        <label>Layout</label>
        <div class="seg">
          <button data-density="cozy" class="${settings.density==='cozy'?'active':''}">Cozy</button>
          <button data-density="compact" class="${settings.density==='compact'?'active':''}">Compact</button>
        </div>
      </div>
      <div class="grp">
        <label>Screen size</label>
        <div class="seg">
          <button id="modeDesktopBtn" class="${!document.body.classList.contains('mobile-mode')?'active':''}">Laptop/PC</button>
          <button id="modeMobileBtn" class="${document.body.classList.contains('mobile-mode')?'active':''}">Phone/Tablet</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modeDesktopBtn').onclick = ()=>{
    try{ localStorage.setItem('offlinePlayerDeviceMode', 'desktop'); }catch(e){}
    applyDeviceMode('desktop'); renderSettingsPanel();
  };
  document.getElementById('modeMobileBtn').onclick = ()=>{
    try{ localStorage.setItem('offlinePlayerDeviceMode', 'mobile'); }catch(e){}
    applyDeviceMode('mobile'); renderSettingsPanel();
  };
  panel.querySelectorAll('.swatch').forEach(sw=>{
    sw.onclick = ()=>{ settings.accent = sw.dataset.color; applySettings(); renderSettingsPanel(); schedulePersist(); };
  });
  panel.querySelectorAll('[data-theme]').forEach(btn=>{
    btn.onclick = ()=>{ settings.theme = btn.dataset.theme; applySettings(); renderSettingsPanel(); schedulePersist(); };
  });
  panel.querySelectorAll('[data-density]').forEach(btn=>{
    btn.onclick = ()=>{ settings.density = btn.dataset.density; applySettings(); renderSettingsPanel(); schedulePersist(); };
  });
}

applySettings();

// ---- Persistence (IndexedDB — fully offline, no account/login needed) ----
const DB_NAME = 'offlinePlayerDB';
const DB_VERSION = 1;

function openDB(){
  return new Promise((resolve)=>{
    if(!('indexedDB' in window)){
      showToast("This browser doesn't support saving locally — your library won't persist between visits.");
      resolve(null);
      return;
    }
    try{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains('state')) d.createObjectStore('state', { keyPath: 'key' });
      };
      req.onsuccess = (e)=> resolve(e.target.result);
      req.onerror = ()=>{
        showToast("Couldn't open local storage — your library may not save.");
        resolve(null);
      };
    }catch(e){
      showToast("Couldn't open local storage — your library may not save.");
      resolve(null);
    }
  });
}

function warnStorageFailureOnce(){
  if(storageWarned) return;
  storageWarned = true;
  showToast("Heads up: couldn't save to local storage. Your changes might not persist — check available storage space.", 6000);
}

function dbPutState(value){
  return new Promise((resolve)=>{
    if(!db){ warnStorageFailureOnce(); resolve(); return; }
    try{
      const tx = db.transaction('state', 'readwrite');
      tx.objectStore('state').put(value);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=>{ warnStorageFailureOnce(); resolve(); };
    }catch(e){ warnStorageFailureOnce(); resolve(); }
  });
}

function dbGetState(){
  return new Promise((resolve)=>{
    if(!db){ resolve(null); return; }
    try{
      const tx = db.transaction('state', 'readonly');
      const req = tx.objectStore('state').get('main');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=>{ warnStorageFailureOnce(); resolve(null); };
    }catch(e){ warnStorageFailureOnce(); resolve(null); }
  });
}

function markDirty(){ dirty = true; }

function schedulePersist(){
  markDirty();
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{ persistAll(); }, 800);
}

async function persistAll(){
  if(!dirty) return;
  dirty = false;
  const data = {
    key: 'main',
    idCounter,
    folders,
    settings,
    statsData,
    tracksData: tracks.map(t => ({
      id: t.id, name: t.name, artist: t.artist, lyrics: t.lyrics || null,
      folders: t.folders, audioBlob: t.rawBlob, coverBlob: t.rawCoverBlob || null
    })),
    folderCoverBlobs: { ...folderCoverRawBlobs }
  };
  await dbPutState(data);
}

async function loadState(){
  const data = await dbGetState();
  if(!data) return;
  idCounter = data.idCounter || 1;
  folders = data.folders && data.folders.length ? data.folders : ["All tracks"];
  if(data.settings) Object.assign(settings, data.settings);
  statsData = data.statsData || { plays: {}, totalSeconds: 0 };

  tracks = (data.tracksData || []).map(td=>{
    let url = null, coverUrl = null;
    try{ url = URL.createObjectURL(td.audioBlob); }catch(e){ /* corrupted entry, skip audio */ }
    if(td.coverBlob){
      try{ coverUrl = URL.createObjectURL(td.coverBlob); }catch(e){ /* fine, no cover */ }
    }
    return {
      id: td.id, name: td.name, artist: td.artist || '', lyrics: td.lyrics || null,
      folders: td.folders || [], coverUrl, url,
      rawBlob: td.audioBlob, rawCoverBlob: td.coverBlob || null
    };
  }).filter(t => t.url); // drop any track whose audio failed to load

  Object.entries(data.folderCoverBlobs || {}).forEach(([name, blob])=>{
    folderCoverRawBlobs[name] = blob;
    try{ folderCovers[name] = URL.createObjectURL(blob); }catch(e){ /* fine */ }
  });

  applySettings();
}

// ---- Device mode (mobile vs desktop) ----
function applyDeviceMode(mode){
  document.body.classList.toggle('mobile-mode', mode === 'mobile');
}

function hideDeviceChooser(){
  const el = document.getElementById('deviceChooser');
  if(el) el.style.display = 'none';
}

function showDeviceChooser(){
  const el = document.getElementById('deviceChooser');
  if(el) el.style.display = 'flex';
}

(function initDeviceMode(){
  let saved = null;
  try{ saved = localStorage.getItem('offlinePlayerDeviceMode'); }catch(e){ /* ignore */ }
  if(saved === 'mobile' || saved === 'desktop'){
    applyDeviceMode(saved);
    hideDeviceChooser();
  }
})();

document.getElementById('chooseMobile').addEventListener('click', ()=>{
  try{ localStorage.setItem('offlinePlayerDeviceMode', 'mobile'); }catch(e){ /* ignore */ }
  applyDeviceMode('mobile');
  hideDeviceChooser();
});

document.getElementById('chooseDesktop').addEventListener('click', ()=>{
  try{ localStorage.setItem('offlinePlayerDeviceMode', 'desktop'); }catch(e){ /* ignore */ }
  applyDeviceMode('desktop');
  hideDeviceChooser();
});

// ---- Folder cover art ----
function buildCoverHtml(folderName, sizeClass){
  if(folderCovers[folderName]){
    return `<div class="${sizeClass} single"><img src="${folderCovers[folderName]}"></div>`;
  }
  const list = getListForFolder(folderName === 'All tracks' ? 'All tracks' : folderName);
  const covers = list.map(t=>t.coverUrl).filter(Boolean).slice(0,4);
  if(covers.length === 0){
    return `<div class="${sizeClass}"><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>`;
  }
  if(covers.length === 1){
    return `<div class="${sizeClass} single"><img src="${covers[0]}"></div>`;
  }
  const slots = [0,1,2,3].map(i=> covers[i] ? `<img src="${covers[i]}">` : `<div class="ph"></div>`).join('');
  return `<div class="${sizeClass}">${slots}</div>`;
}

document.getElementById('selectModeBtn').onclick = ()=>{
  selectMode = !selectMode;
  document.body.classList.toggle('select-mode', selectMode);
  document.getElementById('selectModeBtn').classList.toggle('active', selectMode);
  if(!selectMode) selectedIds.clear();
  render();
};

let pendingCoverFolder = null;
document.getElementById('folderCoverInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(file && pendingCoverFolder){
    if(folderCovers[pendingCoverFolder]) URL.revokeObjectURL(folderCovers[pendingCoverFolder]);
    folderCovers[pendingCoverFolder] = URL.createObjectURL(file);
    folderCoverRawBlobs[pendingCoverFolder] = file;
    schedulePersist();
    render();
  }
  e.target.value = '';
};

function renderFolderHeaderCover(){
  const wrap = document.getElementById('folderHeaderCover');
  wrap.innerHTML = buildCoverHtml(currentFolder, 'folder-header-cover') ;
  // add edit hint overlay on top of the cover element
  const coverEl = wrap.querySelector('.folder-header-cover');
  if(coverEl){
    coverEl.insertAdjacentHTML('beforeend', '<div class="edit-hint">Change cover</div>');
    coverEl.onclick = ()=>{
      if(currentFolder === 'All tracks') return;
      pendingCoverFolder = currentFolder;
      document.getElementById('folderCoverInput').click();
    };
    if(currentFolder === 'All tracks') coverEl.style.cursor = 'default';
  }
}

// ---- Multi-select ----
function renderSelectionBar(){
  const bar = document.getElementById('selectionBar');
  if(!selectMode || selectedIds.size === 0){
    bar.innerHTML = '';
    return;
  }
  bar.innerHTML = `
    <div class="selection-bar">
      <span>${selectedIds.size} selected</span>
      <div class="right">
        <button class="add" id="bulkAddBtn">Add to folder</button>
        <button class="clear" id="bulkClearBtn">Clear</button>
      </div>
    </div>
  `;
  document.getElementById('bulkClearBtn').onclick = ()=>{ selectedIds.clear(); render(); };
  document.getElementById('bulkAddBtn').onclick = (e)=>{
    openBulkFolderPicker(e.currentTarget);
  };
}

function openBulkFolderPicker(anchorBtn){
  document.querySelectorAll('.folder-picker').forEach(p=>p.remove());
  const realFolders = folders.filter(f=>f!=='All tracks');
  const pop = document.createElement('div');
  pop.className = 'folder-picker';
  pop.style.position = 'absolute';
  if(realFolders.length === 0){
    pop.innerHTML = '<div class="none">No folders yet. Create one in the sidebar.</div>';
  } else {
    pop.innerHTML = realFolders.map(f=>`<label><input type="checkbox" data-folder="${escapeHtml(f)}">${escapeHtml(f)}</label>`).join('');
  }
  anchorBtn.parentElement.style.position = 'relative';
  anchorBtn.parentElement.appendChild(pop);
  pop.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      if(!cb.checked) return;
      const f = cb.dataset.folder;
      tracks.forEach(t=>{
        if(selectedIds.has(t.id) && !t.folders.includes(f)) t.folders.push(f);
      });
      schedulePersist();
      render();
      refreshOpenPanels();
    };
  });
  const closeHandler = (e)=>{
    if(!pop.contains(e.target) && e.target !== anchorBtn){
      pop.remove();
      document.removeEventListener('click', closeHandler);
    }
  };
  setTimeout(()=>document.addEventListener('click', closeHandler), 0);
}


function renderFolders(){
  folderListEl.innerHTML = '';
  folders.forEach(f=>{
    const div = document.createElement('div');
    div.className = 'folder-item' + (f===currentFolder ? ' active':'');
    const countNum = f==='All tracks' ? tracks.length : tracks.filter(t=>t.folders.includes(f)).length;
    div.innerHTML = `<span style="display:flex; align-items:center; gap:8px; min-width:0;">${buildCoverHtml(f,'folder-cover')}<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(f)}</span> <span style="color:var(--sub);font-size:12px; flex-shrink:0;">${countNum}</span></span>` +
      (f!=='All tracks' ? `<span class="del" data-folder="${escapeHtml(f)}">&#10005;</span>` : '');
    div.onclick = (e)=>{
      if(e.target.classList.contains('del')) return;
      currentFolder = f; render();
    };
    const delBtn = div.querySelector('.del');
    if(delBtn){
      delBtn.onclick = (e)=>{
        e.stopPropagation();
        showConfirm(`Delete folder "${f}"? Tracks inside stay, just lose this tag.`, ()=>{
          tracks.forEach(t=>{ t.folders = t.folders.filter(x=>x!==f); });
          folders = folders.filter(x=>x!==f);
          if(folderCovers[f]){ URL.revokeObjectURL(folderCovers[f]); delete folderCovers[f]; }
          delete folderCoverRawBlobs[f];
          if(currentFolder===f) currentFolder='All tracks';
          schedulePersist();
          render();
          refreshOpenPanels();
        });
      };
    }
    folderListEl.appendChild(div);
  });
}

// ---- Tracks list ----
function getListForFolder(folderName){
  return folderName==='All tracks' ? tracks : tracks.filter(t=>t.folders.includes(folderName));
}

function renderTracks(){
  const list = getListForFolder(currentFolder);
  folderTitleEl.textContent = currentFolder;
  trackCountEl.textContent = `${list.length} track${list.length!==1?'s':''}`;
  trackListEl.innerHTML = '';
  if(list.length===0){
    trackListEl.innerHTML = '<div class="empty-msg">No tracks here yet. Drop some MP3s or a ZIP above.</div>';
    return;
  }
  list.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'track' + (t.id===currentTrackId ? ' playing':'');
    row.innerHTML = `
      <input type="checkbox" class="track-check" data-id="${t.id}" ${selectedIds.has(t.id)?'checked':''}>
      <div class="idx">${i+1}</div>
      <div class="play-ic">&#9835;</div>
      ${t.coverUrl ? `<img class="cover" src="${t.coverUrl}">` : `<div class="cover-placeholder">&#9835;</div>`}
      <div class="meta" data-id="${t.id}">
        <div class="ttitle">${escapeHtml(t.name)}</div>
        ${t.artist ? `<div class="tartist">${escapeHtml(t.artist)}</div>` : ''}
      </div>
      <div class="actions">
        <div class="folder-picker-wrap">
          <div class="folder-tags" data-id="${t.id}" title="Click to edit folders" style="cursor:pointer;">
            ${t.folders.length ? t.folders.map(f=>`<span class="folder-tag">${escapeHtml(f)}</span>`).join('') : '<span class="folder-tag" style="opacity:.6;">no folder</span>'}
          </div>
        </div>
        <button class="icon-btn rename-btn" data-id="${t.id}" title="Rename">&#9998;</button>
        <button class="icon-btn del-btn" data-id="${t.id}" title="Delete">&#128465;</button>
      </div>
    `;
    row.querySelector('.track-check').onclick = (e)=>{
      e.stopPropagation();
      if(e.target.checked) selectedIds.add(t.id); else selectedIds.delete(t.id);
      renderSelectionBar();
      row.classList.toggle('playing', false);
    };
    row.querySelector('.meta').onclick = ()=>{
      if(selectMode){
        const cb = row.querySelector('.track-check');
        cb.checked = !cb.checked;
        if(cb.checked) selectedIds.add(t.id); else selectedIds.delete(t.id);
        renderSelectionBar();
        return;
      }
      playTrack(t.id, currentFolder);
    };
    row.querySelector('.folder-tags').onclick = (e)=>{
      e.stopPropagation();
      openFolderPicker(row.querySelector('.folder-picker-wrap'), t);
    };
    row.querySelector('.rename-btn').onclick = (e)=>{
      e.stopPropagation();
      startRename(row, t);
    };
    row.querySelector('.del-btn').onclick = (e)=>{
      e.stopPropagation();
      showConfirm(`Delete "${t.name}"?`, ()=>{
        if(t.id===currentTrackId){ audio.pause(); audio.removeAttribute('src'); currentTrackId=null; updateNowPlaying(null); }
        URL.revokeObjectURL(t.url);
        if(t.coverUrl) URL.revokeObjectURL(t.coverUrl);
        tracks = tracks.filter(x=>x.id!==t.id);
        removeFromQueue(t.id);
        delete statsData.plays[t.id];
        schedulePersist();
        render();
        refreshOpenPanels();
      });
    };
    trackListEl.appendChild(row);
  });
}

function openFolderPicker(wrapEl, t){
  document.querySelectorAll('.folder-picker').forEach(p=>p.remove());
  const realFolders = folders.filter(f=>f!=='All tracks');
  const pop = document.createElement('div');
  pop.className = 'folder-picker';
  if(realFolders.length===0){
    pop.innerHTML = '<div class="none">No folders yet. Create one in the sidebar.</div>';
  } else {
    pop.innerHTML = realFolders.map(f=>`
      <label>
        <input type="checkbox" data-folder="${escapeHtml(f)}" ${t.folders.includes(f)?'checked':''}>
        ${escapeHtml(f)}
      </label>
    `).join('');
  }
  wrapEl.appendChild(pop);
  pop.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const f = cb.dataset.folder;
      if(cb.checked){
        if(!t.folders.includes(f)) t.folders.push(f);
      } else {
        t.folders = t.folders.filter(x=>x!==f);
      }
      schedulePersist();
      render();
      refreshOpenPanels();
    };
  });
  const closeHandler = (e)=>{
    if(!pop.contains(e.target)){
      pop.remove();
      document.removeEventListener('click', closeHandler);
    }
  };
  setTimeout(()=>document.addEventListener('click', closeHandler), 0);
}

function startRename(row, t){
  const titleDiv = row.querySelector('.ttitle');
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.value = t.name;
  titleDiv.replaceWith(input);
  input.focus();
  input.select();
  const finish = ()=>{
    const v = input.value.trim();
    if(v) t.name = v;
    schedulePersist();
    render();
    refreshOpenPanels();
    if(t.id === currentTrackId) updateNowPlaying(t);
  };
  input.onblur = finish;
  input.onkeydown = (e)=>{
    if(e.key==='Enter') finish();
    if(e.key==='Escape') render();
  };
}

function render(){
  renderFolders();
  renderTracks();
  renderFolderHeaderCover();
  renderSelectionBar();
}

// Keep the queue/lyrics/profile panels in sync if they're open while
// something elsewhere changes (rename, delete, folder edit, etc.) instead
// of silently going stale until manually closed and reopened.
function refreshOpenPanels(){
  if(document.getElementById('queuePanel').style.display !== 'none') renderQueuePanel();
  if(document.getElementById('lyricsPanel').style.display !== 'none') renderLyricsPanel();
  if(document.getElementById('profilePanel').style.display !== 'none') renderProfilePanel();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showConfirm(message, onYes){
  const area = document.getElementById('confirmArea');
  area.innerHTML = `
    <div class="confirm-box">
      <div class="msg">${escapeHtml(message)}</div>
      <div class="row">
        <button class="yes">Yes, delete</button>
        <button class="no">Cancel</button>
      </div>
    </div>
  `;
  area.querySelector('.yes').onclick = ()=>{ area.innerHTML=''; onYes(); };
  area.querySelector('.no').onclick = ()=>{ area.innerHTML=''; };
}

function showMessage(message){
  const area = document.getElementById('confirmArea');
  area.innerHTML = `<div class="confirm-box"><div class="msg">${escapeHtml(message)}</div>
    <div class="row"><button class="no">OK</button></div></div>`;
  area.querySelector('.no').onclick = ()=>{ area.innerHTML=''; };
}

// ---- File handling ----
async function handleFiles(fileList){
  for(const file of fileList){
    if(file.name.toLowerCase().endsWith('.zip') || file.type==='application/zip'){
      await handleZip(file);
    } else if(file.type==='audio/mpeg' || file.name.toLowerCase().endsWith('.mp3')){
      await addTrack(file, file.name.replace(/\.mp3$/i,''));
    }
  }
  render();
}

async function handleZip(zipFile){
  try{
    const zip = await JSZip.loadAsync(zipFile);
    const entries = Object.values(zip.files).filter(f=>!f.dir && f.name.toLowerCase().endsWith('.mp3'));
    for(const entry of entries){
      const blob = await entry.async('blob');
      const mp3blob = new Blob([blob], {type:'audio/mpeg'});
      const name = entry.name.split('/').pop().replace(/\.mp3$/i,'');
      await addTrack(mp3blob, name);
    }
  }catch(err){
    showMessage('Could not read zip file: ' + err.message);
  }
}

function readTagsAsync(fileOrBlob){
  return new Promise((resolve)=>{
    if(typeof jsmediatags === 'undefined'){ resolve({}); return; }
    jsmediatags.read(fileOrBlob, {
      onSuccess: (result)=>{
        const tags = result.tags || {};
        let coverUrl = null;
        let coverBlob = null;
        if(tags.picture){
          try{
            const { data, format } = tags.picture;
            const bytes = new Uint8Array(data);
            coverBlob = new Blob([bytes], { type: format });
            coverUrl = URL.createObjectURL(coverBlob);
          }catch(e){ /* no cover, fine */ }
        }
        // Embedded lyrics (ID3 USLT frame) come through in a couple of shapes
        // depending on the encoder, so check both.
        let lyrics = null;
        if(tags.lyrics){
          if(typeof tags.lyrics === 'string' && tags.lyrics.trim()) lyrics = tags.lyrics.trim();
          else if(tags.lyrics.lyrics && tags.lyrics.lyrics.trim()) lyrics = tags.lyrics.lyrics.trim();
        }
        resolve({
          title: (tags.title && tags.title.trim()) ? tags.title.trim() : null,
          artist: (tags.artist && tags.artist.trim()) ? tags.artist.trim() : null,
          coverUrl,
          coverBlob,
          lyrics
        });
      },
      onError: ()=> resolve({})
    });
  });
}

async function addTrack(fileOrBlob, filenameFallback){
  const tagInfo = await readTagsAsync(fileOrBlob);
  const displayName = tagInfo.title || filenameFallback || 'Untitled';
  const artist = tagInfo.artist || '';
  const norm = (s)=> (s||'').toLowerCase().trim();

  // Match on the real song title + artist (from tags), not the raw file bytes.
  // This way the same song still counts as "the same" whether it arrived
  // as a standalone MP3 or packed inside a zip, even if the file sizes differ.
  const existing = tracks.find(t => norm(t.name) === norm(displayName) && norm(t.artist) === norm(artist));
  if(existing){
    if(currentFolder !== 'All tracks' && !existing.folders.includes(currentFolder)){
      existing.folders.push(currentFolder);
      schedulePersist();
    }
    if(tagInfo.coverUrl) URL.revokeObjectURL(tagInfo.coverUrl);
    return;
  }

  const url = URL.createObjectURL(fileOrBlob);
  const track = {
    id: idCounter++,
    name: displayName,
    artist,
    coverUrl: tagInfo.coverUrl || null,
    lyrics: tagInfo.lyrics || null,
    url,
    folders: currentFolder!=='All tracks' ? [currentFolder] : [],
    rawBlob: fileOrBlob,
    rawCoverBlob: tagInfo.coverBlob || null
  };
  tracks.push(track);
  schedulePersist();
}

dropzone.onclick = ()=>fileInput.click();
fileInput.onchange = (e)=>handleFiles(e.target.files);
['dragover','dragenter'].forEach(ev=>dropzone.addEventListener(ev, e=>{
  e.preventDefault(); dropzone.classList.add('drag');
}));
['dragleave','dragend'].forEach(ev=>dropzone.addEventListener(ev, e=>{
  dropzone.classList.remove('drag');
}));
dropzone.addEventListener('drop', e=>{
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});

function bindNewFolderBtn(){
  const btn = document.getElementById('newFolderBtn');
  if(btn) btn.onclick = openNewFolderForm;
}

function openNewFolderForm(){

  area.innerHTML = `
    <div class="new-folder-row">
      <input type="text" id="newFolderInput" placeholder="Folder name">
      <button id="newFolderSave">Add</button>
    </div>
  `;
  const input = document.getElementById('newFolderInput');

function resetNewFolderArea(){
  document.getElementById('newFolderArea').innerHTML =
    '<button class="new-folder-btn" id="newFolderBtn">+ New folder</button>';
  bindNewFolderBtn();
}

bindNewFolderBtn();

// ---- Playback / Queue ----
// The queue is a list of track ids representing what's coming up.
// Starting playback from a folder builds a fresh queue from that folder's
// current order. Once playing, you can reorder/remove items in the Queue
// panel — that only affects this session's playback order, never the
// folder's actual contents. Switching to a different folder replaces the
// queue entirely.
let queue = [];
let queueIndex = -1;
let queueSourceFolder = null;

// True whenever we *intend* for something to be playing — used to detect
// and recover from background-throttling glitches on mobile, where the
// browser silently stalls/kills audio while the tab is hidden and never
// fires the events we'd normally rely on.
let expectedPlaying = false;
// Guards against overlapping play() calls racing each other while a new
// track is still loading (can happen if you mash next/prev quickly, or
// if a resync kicks in mid-transition).
let loadGeneration = 0;

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueueFromFolder(folder){
  const list = getListForFolder(folder);
  queue = list.map(t => t.id);
  queueSourceFolder = folder;
}

function removeFromQueue(id){
  const idx = queue.indexOf(id);
  if(idx === -1) return;
  queue.splice(idx, 1);
  if(idx < queueIndex) queueIndex--;
  else if(idx === queueIndex) queueIndex = Math.min(queueIndex, queue.length - 1);
}

document.getElementById('shuffleBtn').onclick = ()=>{
  const btn = document.getElementById('shuffleBtn');
  if(queue.length < 2){
    // Give feedback instead of doing nothing silently.
    btn.style.opacity = '1';
    showToast('Nothing to shuffle yet — play a folder with more than one song first.', 2500);
    return;
  }
  const currentId = queue[queueIndex];
  queue = shuffleArray(queue);
  queueIndex = queue.indexOf(currentId);
  renderQueuePanel();
  showToast('Shuffled the upcoming songs.', 1500);
};

function playTrack(id, folderContext){
  if(folderContext && folderContext !== queueSourceFolder){
    buildQueueFromFolder(folderContext);
  }
  let idx = queue.indexOf(id);
  if(idx === -1){
    queue = [id];
    queueSourceFolder = folderContext || queueSourceFolder;
    idx = 0;
  }
  playTrackByQueueIndex(idx);
}

function resetSeekDisplay(){
  document.getElementById('seek').value = 0;
  document.getElementById('curTime').textContent = '0:00';
  document.getElementById('durTime').textContent = '0:00';
}

function playTrackByQueueIndex(idx){
  if(idx < 0 || idx >= queue.length) return;
  const id = queue[idx];
  const t = tracks.find(x=>x.id===id);
  if(!t) return;
  const isNewTrack = currentTrackId !== id;
  queueIndex = idx;

  // Re-clicking the song that's already loaded and playing should just
  // be a no-op (or a restart-from-0 if it already finished), not a full
  // reload + re-render.
  if(!isNewTrack){
    if(audio.paused || audio.ended){
      audio.currentTime = 0;
      expectedPlaying = true;
      audio.play().catch(()=>{ expectedPlaying = false; });
    }
    updateNowPlaying(t);
    return;
  }

  loadGeneration++;
  const myGeneration = loadGeneration;

  currentTrackId = id;
  resetSeekDisplay(); // don't leave a stale seek position from the previous track
  audio.src = t.url;
  expectedPlaying = true;
  audio.play().catch(()=>{
    // Playback was blocked/failed (e.g. backgrounded tab). Reflect that
    // honestly in the UI instead of pretending it's playing.
    if(myGeneration === loadGeneration) expectedPlaying = false;
  });
  updateNowPlaying(t);
  updateMediaSession(t);
  render();
  recordPlayStart(id);
  refreshOpenPanels();
}

function updateNowPlaying(t){
  document.getElementById('nowTitle').textContent = t ? t.name : 'Nothing playing';
  document.getElementById('nowFolder').textContent = t
    ? (t.artist ? t.artist : (t.folders.length ? t.folders.join(', ') : 'No folder'))
    : '\u00A0';
  document.getElementById('playBtn').innerHTML = (t && !audio.paused) ? '&#10074;&#10074;' : '&#9658;';
  const coverWrap = document.getElementById('nowCoverWrap');
  if(t && t.coverUrl){
    coverWrap.outerHTML = `<img id="nowCoverWrap" class="now-cover" src="${t.coverUrl}">`;
  } else {
    coverWrap.outerHTML = `<div id="nowCoverWrap" class="now-cover-placeholder">&#9835;</div>`;
  }
}

// ---- Media Session API ----
// This is the real fix for a lot of mobile background-playback weirdness:
// it tells the OS/browser about what's playing and gives it proper
// play/pause/next/prev hooks (lock screen, notification controls, etc.),
// which makes background playback far more reliable than relying purely
// on our own JS timers while the tab is hidden.
function updateMediaSession(t){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name || 'Unknown track',
      artist: t.artist || '',
      artwork: t.coverUrl ? [{ src: t.coverUrl, sizes: '512x512', type: 'image/png' }] : []
    });
    navigator.mediaSession.setActionHandler('play', ()=>{ expectedPlaying = true; audio.play().catch(()=>{}); });
    navigator.mediaSession.setActionHandler('pause', ()=>{ expectedPlaying = false; audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', ()=> skip(-1));
    navigator.mediaSession.setActionHandler('nexttrack', ()=> skip(1));
  }catch(e){ /* not critical if this fails on a given browser */ }
}

document.getElementById('playBtn').onclick = ()=>{
  if(!audio.src) return;
  if(audio.paused){
    expectedPlaying = true;
    audio.play().catch(()=>{ expectedPlaying = false; });
  } else {
    expectedPlaying = false;
    audio.pause();
  }
};
audio.onplay = ()=>{ expectedPlaying = true; document.getElementById('playBtn').innerHTML='&#10074;&#10074;'; if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; };
audio.onpause = ()=>{ document.getElementById('playBtn').innerHTML='&#9658;'; if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; };

document.getElementById('nextBtn').onclick = ()=>skip(1);
document.getElementById('prevBtn').onclick = ()=>skip(-1);

let repeatOne = false;
document.getElementById('repeatBtn').onclick = ()=>{
  repeatOne = !repeatOne;
  document.getElementById('repeatBtn').classList.toggle('active', repeatOne);
};

function skip(dir){
  if(!queue.length) return;
  let newIdx = queueIndex + dir;
  if(newIdx < 0) newIdx = queue.length - 1;
  if(newIdx >= queue.length) newIdx = 0;
  playTrackByQueueIndex(newIdx);
}

audio.onended = ()=>{
  if(repeatOne){
    audio.currentTime = 0;
    expectedPlaying = true;
    audio.play().catch(()=>{ expectedPlaying = false; });
    recordPlayStart(currentTrackId);
  } else {
    skip(1);
  }
};

// If playback errors out entirely (corrupted load, lost blob URL after
// a backgrounding event, etc.), don't just leave the UI stuck — surface
// it and stop pretending something is playing.
audio.onerror = ()=>{
  expectedPlaying = false;
  showToast("Playback hit a snag on this track. Try selecting it again.", 3000);
};

// ---- Background/foreground resync ----
// Mobile browsers throttle timers and can pause/kill audio while the tab
// or PWA is backgrounded, often without firing the events we'd normally
// rely on (onended, onpause). This is the fix for "song ends while phone
// is locked/closed and the app comes back fully stuck": whenever we
// regain visibility/focus, we actively verify reality (what's the audio
// element actually doing) against our own state, and reconcile instead of
// trusting stale event-driven assumptions.
function resyncPlaybackState(){
  if(currentTrackId == null) return;
  const t = tracks.find(x=>x.id===currentTrackId);
  if(!t) return;

  const srcLost = !audio.src || !audio.src.includes(t.url.split('/').pop());

  if(srcLost){
    // The audio element lost its source entirely (can happen under
    // memory pressure while backgrounded). Reload it, then restore the
    // playback position only once metadata is actually ready — setting
    // currentTime before that point gets silently dropped.
    const wasPlaying = expectedPlaying;
    audio.src = t.url;
    const onceReady = ()=>{
      audio.removeEventListener('loadedmetadata', onceReady);
      if(wasPlaying) audio.play().catch(()=>{ expectedPlaying = false; });
    };
    audio.addEventListener('loadedmetadata', onceReady);
    render();
    refreshOpenPanels();
    return;
  }

  if(audio.ended){
    // 'ended' fired while we weren't around to react to it (or got
    // suspended mid-handler). Advance the queue ourselves now.
    if(repeatOne){
      audio.currentTime = 0;
      expectedPlaying = true;
      audio.play().catch(()=>{ expectedPlaying = false; });
      recordPlayStart(currentTrackId);
    } else {
      skip(1);
    }
    return;
  }

  if(expectedPlaying && audio.paused){
    // We think it should be playing, but it's silently paused — try to
    // resume rather than leaving the UI lying about playback state.
    audio.play().catch(()=>{ expectedPlaying = false; });
  }

  updateNowPlaying(t);
  render();
  refreshOpenPanels();
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') resyncPlaybackState();
});
window.addEventListener('focus', resyncPlaybackState);
window.addEventListener('pageshow', resyncPlaybackState);

// ---- Queue panel ----
document.getElementById('queueBtn').onclick = ()=>{
  const panel = document.getElementById('queuePanel');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  document.getElementById('queueBtn').classList.toggle('active', !isOpen);
  if(!isOpen) renderQueuePanel();
};

function renderQueuePanel(){
  const panel = document.getElementById('queuePanel');
  const label = queueSourceFolder ? `Queue \u2014 ${queueSourceFolder}` : 'Queue';
  panel.innerHTML = `
    <div class="lp-header"><span>${escapeHtml(label)}</span><button class="lp-close" id="qpCloseBtn">&#10005;</button></div>
    <div class="lp-body" id="qpBody"></div>
  `;
  document.getElementById('qpCloseBtn').onclick = ()=>{ panel.style.display='none'; document.getElementById('queueBtn').classList.remove('active'); };
  const body = document.getElementById('qpBody');
  if(!queue.length){
    body.innerHTML = '<div class="lp-empty">Nothing queued. Play a song from a folder to start one.</div>';
    return;
  }
  body.innerHTML = queue.map((id, i)=>{
    const t = tracks.find(x=>x.id===id);
    if(!t) return '';
    return `
      <div class="q-row${i===queueIndex?' current':''}" data-idx="${i}">
        ${t.coverUrl ? `<img class="q-cover" src="${t.coverUrl}">` : `<div class="q-cover-ph"></div>`}
        <div class="q-meta">
          <div class="q-title">${escapeHtml(t.name)}</div>
          ${t.artist ? `<div class="q-artist">${escapeHtml(t.artist)}</div>` : ''}
        </div>
        <div class="q-actions">
          <button class="q-up" title="Move up">&#9650;</button>
          <button class="q-down" title="Move down">&#9660;</button>
          <button class="q-remove" title="Remove from queue">&#10005;</button>
        </div>
      </div>
    `;
  }).join('');

  body.querySelectorAll('.q-row').forEach(row=>{
    const i = parseInt(row.dataset.idx, 10);
    row.querySelector('.q-meta').onclick = ()=> playTrackByQueueIndex(i);
    row.querySelector('.q-up').onclick = (e)=>{
      e.stopPropagation();
      if(i === 0) return;
      [queue[i-1], queue[i]] = [queue[i], queue[i-1]];
      if(queueIndex === i) queueIndex--; else if(queueIndex === i-1) queueIndex++;
      renderQueuePanel();
    };
    row.querySelector('.q-down').onclick = (e)=>{
      e.stopPropagation();
      if(i === queue.length - 1) return;
      [queue[i], queue[i+1]] = [queue[i+1], queue[i]];
      if(queueIndex === i) queueIndex++; else if(queueIndex === i+1) queueIndex--;
      renderQueuePanel();
    };
    row.querySelector('.q-remove').onclick = (e)=>{
      e.stopPropagation();
      const removedId = queue[i];
      removeFromQueue(removedId);
      if(removedId === currentTrackId){
        if(queue.length){
          playTrackByQueueIndex(Math.min(i, queue.length - 1));
        } else {
          audio.pause(); audio.removeAttribute('src'); currentTrackId = null; updateNowPlaying(null); render();
        }
      }
      renderQueuePanel();
    };
  });
}

// ---- Listening stats ----
function recordPlayStart(id){
  if(id == null) return;
  if(!statsData.plays[id]) statsData.plays[id] = { count: 0, seconds: 0 };
  statsData.plays[id].count++;
  schedulePersist();
}

// Accrue listening time once per second while something is actually playing.
setInterval(()=>{
  if(!audio.paused && currentTrackId != null){
    if(!statsData.plays[currentTrackId]) statsData.plays[currentTrackId] = { count: 0, seconds: 0 };
    statsData.plays[currentTrackId].seconds += 1;
    statsData.totalSeconds = (statsData.totalSeconds || 0) + 1;
    markDirty();
    // Keep the stats panel live if it's open while listening, instead of
    // only showing a snapshot from whenever it was opened.
    if(document.getElementById('profilePanel').style.display !== 'none') renderProfilePanel();
  }
}, 1000);

// Continuous playback keeps the debounce timer perpetually reset, so this
// safety-net flush guarantees stats actually get saved every ~10s regardless.
setInterval(()=>{ if(dirty) persistAll(); }, 10000);

// Extra resync safety net: some mobile browsers don't reliably fire
// visibilitychange/focus when returning from a fully backgrounded PWA.
// A cheap periodic check catches anything those events miss.
setInterval(()=>{ if(document.visibilityState === 'visible') resyncPlaybackState(); }, 15000);

function formatDuration(totalSeconds){
  const s = Math.floor(totalSeconds || 0);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if(h > 0) return `${h}h ${m}m`;
  if(m > 0) return `${m}m`;
  return `${s}s`;
}

// ---- Profile / stats panel ----
document.getElementById('profileBtn').onclick = ()=>{
  const panel = document.getElementById('profilePanel');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  if(!isOpen) renderProfilePanel();
};

function renderProfilePanel(){
  const panel = document.getElementById('profilePanel');
  const entries = Object.entries(statsData.plays || {});
  if(!entries.length){
    panel.innerHTML = '<div class="lp-empty">No listening data yet \u2014 play some songs!</div>';
    return;
  }

  let topSongId = null, topSongSeconds = -1;
  entries.forEach(([id, d])=>{ if(d.seconds > topSongSeconds){ topSongSeconds = d.seconds; topSongId = id; } });
  const topTrack = tracks.find(t => String(t.id) === String(topSongId));

  const artistSeconds = {};
  entries.forEach(([id, d])=>{
    const t = tracks.find(x => String(x.id) === String(id));
    if(t && t.artist){ artistSeconds[t.artist] = (artistSeconds[t.artist] || 0) + d.seconds; }
  });
  let topArtist = null, topArtistSeconds = -1;
  Object.entries(artistSeconds).forEach(([a, s])=>{ if(s > topArtistSeconds){ topArtistSeconds = s; topArtist = a; } });

  panel.innerHTML = `
    <div class="stat-row"><span>Total listening time</span><b>${formatDuration(statsData.totalSeconds)}</b></div>
    <div class="stat-divider"></div>
    <div class="stat-row"><span>Most played song</span><b>${topTrack ? escapeHtml(topTrack.name) : '\u2014'}</b></div>
    <div class="stat-row"><span>Most played artist</span><b>${topArtist ? escapeHtml(topArtist) : '\u2014'}</b></div>
  `;
}

// ---- Lyrics panel ----
document.getElementById('lyricsBtn').onclick = ()=>{
  const panel = document.getElementById('lyricsPanel');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  document.getElementById('lyricsBtn').classList.toggle('active', !isOpen);
  if(!isOpen) renderLyricsPanel();
};

function renderLyricsPanel(){
  const panel = document.getElementById('lyricsPanel');
  const t = tracks.find(x=>x.id===currentTrackId);
  if(!t){
    panel.innerHTML = `
      <div class="lp-header"><span>Lyrics</span><button class="lp-close" id="lpCloseBtn">&#10005;</button></div>
      <div class="lp-body"><div class="lp-empty">Nothing playing yet.</div></div>
    `;
    document.getElementById('lpCloseBtn').onclick = ()=>{ panel.style.display='none'; document.getElementById('lyricsBtn').classList.remove('active'); };
    return;
  }
  panel.innerHTML = `
    <div class="lp-header"><span>${escapeHtml(t.name)}</span><button class="lp-close" id="lpCloseBtn">&#10005;</button></div>
    <div class="lp-body" id="lpBody"></div>
    <div class="lp-footer">
      <button class="lp-edit" id="lpEditBtn">${t.lyrics ? 'Edit' : 'Add lyrics'}</button>
    </div>
  `;
  const body = document.getElementById('lpBody');
  if(t.lyrics){
    body.textContent = t.lyrics;
  } else {
    body.innerHTML = '<div class="lp-empty">No lyrics found in this file\'s tags. You can paste your own below.</div>';
  }
  document.getElementById('lpCloseBtn').onclick = ()=>{ panel.style.display='none'; document.getElementById('lyricsBtn').classList.remove('active'); };
  document.getElementById('lpEditBtn').onclick = ()=>{
    body.innerHTML = `<textarea id="lpTextarea" placeholder="Paste lyrics here...">${escapeHtml(t.lyrics || '')}</textarea>`;
    const footer = panel.querySelector('.lp-footer');
    footer.innerHTML = `<button class="lp-edit" id="lpCancelBtn">Cancel</button><button class="lp-save" id="lpSaveBtn">Save</button>`;
    document.getElementById('lpCancelBtn').onclick = ()=> renderLyricsPanel();
    document.getElementById('lpSaveBtn').onclick = ()=>{
      t.lyrics = document.getElementById('lpTextarea').value.trim() || null;
      schedulePersist();
      renderLyricsPanel();
    };
  };
}

audio.ontimeupdate = ()=>{
  if(!audio.duration) return;
  document.getElementById('seek').value = (audio.currentTime/audio.duration)*100;
  document.getElementById('curTime').textContent = fmtTime(audio.currentTime);
  document.getElementById('durTime').textContent = fmtTime(audio.duration);
  if('mediaSession' in navigator && navigator.mediaSession.setPositionState){
    try{
      navigator.mediaSession.setPositionState({
        duration: audio.duration || 0,
        playbackRate: audio.playbackRate || 1,
        position: Math.min(audio.currentTime || 0, audio.duration || 0)
      });
    }catch(e){ /* not all browsers support this, fine to skip */ }
  }
};
document.getElementById('seek').oninput = (e)=>{
  if(!audio.duration) return;
  audio.currentTime = (e.target.value/100)*audio.duration;
};
document.getElementById('vol').oninput = (e)=>{ audio.volume = e.target.value; };
audio.volume = 0.8;

function fmtTime(s){
  if(isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

(async function init(){
  db = await openDB();
  await loadState();
  render();
})();

// ---- PWA: register service worker so this works fully offline after first load ----
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if this fails, e.g. on file:// */ });
  });
}
